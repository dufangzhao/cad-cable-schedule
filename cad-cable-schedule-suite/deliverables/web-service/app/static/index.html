<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电缆汇总表服务</title>
<style>
 :root{--bg:#f5f7fa;--card:#fff;--line:#d9e1ec;--accent:#1f6feb;--muted:#5c6b7a;--ok:#1a7f37}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:#1c2530;font:15px/1.65 "Microsoft YaHei",system-ui,sans-serif}
 .wrap{max-width:820px;margin:5vh auto;padding:0 20px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 30px}
 h1{font-size:21px;margin:0 0 6px}
 p.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
 label{display:block;font-weight:600;margin:16px 0 6px;font-size:14px}
 input[type=file],input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit}
 .row{display:flex;gap:14px}.row>div{flex:1}
 button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
 button:disabled{background:#9db4d4;cursor:progress}
 .hint{color:var(--muted);font-size:13px;margin-top:8px}
 pre{margin-top:16px;background:#0f172a;color:#d6e2f0;padding:14px;border-radius:8px;overflow:auto;font-size:13px;max-height:300px}
 .warn{margin-top:16px;border-left:3px solid #e0a800;background:#fff8e1;padding:10px 14px;font-size:13.5px;border-radius:0 6px 6px 0;max-height:280px;overflow:auto}
 .tabs{display:flex;gap:8px;margin:18px 0 0}
 .tab{padding:7px 14px;border:1px solid var(--line);border-radius:6px 6px 0 0;background:#eef2f7;cursor:pointer;font-size:14px}
 .tab.active{background:#fff;border-bottom-color:#fff;font-weight:600}
 table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
 th,td{border:1px solid var(--line);padding:6px 9px;text-align:center}
 th{background:#f0f4f9}
 #result{display:none}
</style></head>
<body><div class="wrap"><div class="card">
  <h1>电缆表汇总 → 采购用 Excel</h1>
  <p class="sub">按 <b>电缆型号 / 选用芯数 / 每芯截面(mm²)</b> 三项完全一致合并计数（长度相加），任一项不同即另起一行。</p>
  <form id="f">
    <label>① 上传内容</label>
    <input type="file" name="file" accept=".dxf,.tsv,.txt,.json" required>
    <div class="hint">
      <b>推荐</b>：CAD 插件导出的 TSV（约 85 KB，只含选中的文字）<br>
      也可：CAD 中 <code>WBLOCK</code> 选中的电缆表，或整图 <code>SAVEAS → DXF</code>（整图同样识别，无需先选择）
    </div>
    <div class="row">
      <div><label>② 工程/图号（可选）</label><input type="text" name="project" placeholder="例如 样例工程-V2"></div>
      <div><label>③ 只有电缆号、参数全空的行</label>
        <select name="keep_incomplete" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit">
          <option value="false">不计入汇总，只登记待确认（推荐）</option>
          <option value="true">也计入，使合计与原图行数对账</option>
        </select></div>
    </div>
    <button id="go" type="submit">开始汇总</button>
  </form>
  <div id="result">
    <div id="download"></div>
    <pre id="detail"></pre>
    <div id="table"></div>
    <div id="issues" class="warn" style="display:none"></div>
  </div>
</div></div>
<script>
const f = document.getElementById('f');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = '正在解析与汇总…';
  document.getElementById('result').style.display = 'none';
  try {
    const res = await fetch('/api/summarize', { method: 'POST', body: new FormData(f) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    const a = document.createElement('a');
    a.href = '/api/download?id=' + encodeURIComponent(data.ticket);
    a.textContent = '⬇ 下载 ' + data.filename;
    a.style.cssText = 'display:inline-block;margin-top:16px;padding:11px 18px;background:var(--ok);color:#fff;border-radius:6px;text-decoration:none;font-weight:600';
    const dl = document.getElementById('download'); dl.innerHTML = ''; dl.appendChild(a);

    const m = data.metadata || {};
    document.getElementById('detail').textContent =
      '识别电缆表: ' + m.recognised_tables + ' 张
' +
      '读出电缆记录: ' + m.source_row_count + ' 行
' +
      '汇总类别: ' + m.summary_row_count + ' 类
' +
      '数量合计: ' + m.total_quantity + ' 根
' +
      (m.skipped_incomplete_rows ? '参数全空未计入: ' + m.skipped_incomplete_rows + ' 行
' : '');

    const rows = (data.records || []).slice(0, 60);
    let html = '<table><tr><th>电缆型号</th><th>选用芯数</th><th>每芯截面(mm²)</th><th>长度(m)</th><th>数量</th></tr>';
    for (const r of rows) {
      html += '<tr><td>' + (r.spec || '') + '</td><td>' + (r.selected_cores || '') + '</td><td>'
            + (r.core_section || '') + '</td><td>' + (r.length || '') + '</td><td>' + r.quantity + '</td></tr>';
    }
    if ((data.records || []).length > rows.length) html += '<tr><td colspan="5">…共 ' + data.records.length + ' 类，完整内容见下载文件</td></tr>';
    document.getElementById('table').innerHTML = html + '</table>';

    const issues = data.issues || [];
    const box = document.getElementById('issues');
    if (issues.length) {
      box.style.display = 'block';
      box.innerHTML = '<b>交付前请确认 ' + issues.length + ' 项：</b><br>'
        + issues.map(i => '· [' + i.severity + '] ' + i.message).join('<br>');
    }
    document.getElementById('result').style.display = 'block';
  } catch (err) {
    alert('处理失败：' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = '开始汇总';
  }
});
</script></body></html>
